<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件列表 - 书可听</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="weixin-style">
    <div class="container">
        <header class="header">
            <button class="back-btn" onclick="history.back()">← 返回</button>
            <h1 id="fileName">文件列表</h1>
        </header>

        <main class="main-content">
            <!-- 分页信息 -->
            <div class="pagination-info">
                <span id="pageInfo">第 1 页</span>
            </div>

            <!-- 文件片段列表 -->
            <div id="segmentList" class="segment-list">
                <div class="loading">加载中...</div>
            </div>

            <!-- 翻页按钮 -->
            <div class="pagination-buttons">
                <button id="prevBtn" class="pagination-btn" onclick="prevPage()">上一页</button>
                <span id="pageNumber"></span>
                <button id="nextBtn" class="pagination-btn" onclick="nextPage()">下一页</button>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/list.js') }}"></script>
</body>
</html>
